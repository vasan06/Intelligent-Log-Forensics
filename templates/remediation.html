<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Remediation Playbooks</title><link rel="stylesheet" href="/static/css/tokens.css"><link rel="stylesheet" href="/static/css/layout.css"><link rel="stylesheet" href="/static/css/components.css"></head>
<body><main class="app-main" style="margin-left:0"><header class="app-topbar"><h1 class="page-title">Remediation Playbooks</h1><a class="btn btn-secondary btn-sm" href="/dashboard">Dashboard</a></header><div class="page-container"><div class="grid-kpi">{% for risk in risks %}<article class="forensic-card"><span class="kpi-label">{{ risk.category }}</span><h2 class="card-title">{{ risk.technique_id or 'Unclassified' }}</h2><p>{{ risk.c }} observed signals</p><span class="badge badge-high">{{ risk.severity }}</span></article>{% else %}<div class="forensic-card">No active remediation items.</div>{% endfor %}</div></div></main></body></html>

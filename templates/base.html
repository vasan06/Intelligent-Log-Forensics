
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#f6f8fb"
    >

    <meta
        name="color-scheme"
        content="light"
    >

    <meta
        name="description"
        content="Intelligent Log Forensics — intelligent security log analysis and forensic investigation."
    >

    <title>
        {% block title %}
        Intelligent Log Forensics
        {% endblock %}
    </title>


    <!-- =====================================================
         FONTS
    ====================================================== -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet"
    >


    <!-- =====================================================
         GLOBAL DESIGN SYSTEM
    ====================================================== -->

    <link
        rel="stylesheet"
        href="../static/css/tokens.css"
    >

    <link
        rel="stylesheet"
        href="../static/css/base.css"
    >

    <link
        rel="stylesheet"
        href="../static/css/components.css"
    >

    <link
        rel="stylesheet"
        href="../static/css/animations.css"
    >


    <!-- =====================================================
         APPLICATION SHELL
    ====================================================== -->

    {% block shell_css %}
    {% endblock %}


    <!-- =====================================================
         PAGE-SPECIFIC CSS
    ====================================================== -->

    {% block extra_css %}
    {% endblock %}

</head>


<body
    {% block body_class %}
    {% endblock %}
>


    <!-- =====================================================
         APPLICATION
    ====================================================== -->

    {% block body %}
    {% endblock %}


    <!-- =====================================================
         GLOBAL TOAST SYSTEM
    ====================================================== -->

    <div
        class="toast-container"
        id="toast-container"
        aria-live="polite"
        aria-atomic="true"
    ></div>


    <!-- =====================================================
         SERVER FLASH MESSAGES
    ====================================================== -->

    {% with messages = get_flashed_messages(with_categories=true) %}

        {% if messages %}
        <div
            id="ilf-flash-messages"
            data-messages="{{ messages | tojson | forceescape }}"
            hidden
        ></div>

        {% endif %}

    {% endwith %}


    <!-- =====================================================
         GLOBAL JAVASCRIPT
    ====================================================== -->

    <script
        src="../static/js/base.js"
        defer
    ></script>


    <!-- =====================================================
         APPLICATION SHELL JS
    ====================================================== -->

    {% block shell_js %}
    {% endblock %}


    <!-- =====================================================
         PAGE-SPECIFIC JAVASCRIPT
    ====================================================== -->

    {% block extra_js %}
    {% endblock %}


</body>

</html>

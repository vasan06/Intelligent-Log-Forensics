services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Postgres is also exposed on host port 5433 so local tooling can connect
      # to the same database the containerized app uses (5432 is left free).
      - "${POSTGRES_HOST_PORT:-5433}:5432"

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:5000}
      UPLOAD_FOLDER: /app/instance/uploads
      MODEL_FOLDER: /app/instance/models
      MODEL_PATH: /app/instance/models/anomaly_ensemble.joblib
      REPORT_FOLDER: /app/instance/reports
      UPLOAD_RETENTION_HOURS: ${UPLOAD_RETENTION_HOURS:-24}
    ports:
      - "5000:5000"
    volumes:
      - uploads_data:/app/instance/uploads
      - models_data:/app/instance/models
      - reports_data:/app/instance/reports

volumes:
  postgres_data:
  uploads_data:
  models_data:
  reports_data:

version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ilf_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ilf_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ilf_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ilf_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: ilf_web
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - DATABASE_URL=postgresql+psycopg://postgres:postgres@postgres:5432/ilf_db
      - ADMIN_EMAIL=vasan83000@gmail.com
      - ADMIN_PASSWORD=Vasan@83000
      - LOKY_MAX_CPU_COUNT=2
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  ilf_pgdata:

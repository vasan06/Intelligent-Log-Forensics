<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>ATT&CK Catalog — ILF</title>
<link rel="stylesheet" href="assets/css/tokens.css"/>
<link rel="stylesheet" href="assets/css/global.css"/>
<link rel="stylesheet" href="assets/css/components.css"/>
<link rel="stylesheet" href="assets/css/navbar.css"/>
<link rel="stylesheet" href="assets/css/animations.css"/>
<style>
/* Tactic sidebar */
.catalog-layout { display: flex; gap: var(--sp-5); align-items: flex-start; }
.tactic-sidebar { width: 220px; flex-shrink: 0; position: sticky; top: 80px; }
.tactic-nav-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 12px; border-radius: var(--r-md);
  font-size: var(--text-sm); font-weight: 500; color: var(--ink-1);
  cursor: pointer; transition: all var(--t-fast); margin-bottom: 2px;
}
.tactic-nav-item:hover { background: var(--surface-2); }
.tactic-nav-item.active { background: var(--brand-dim); color: var(--brand-primary); font-weight: 600; }
.tactic-count { font-size: var(--text-xs); background: var(--surface-3); color: var(--ink-2); padding: 1px 7px; border-radius: var(--r-full); }
.tactic-nav-item.active .tactic-count { background: rgba(45,43,107,0.15); color: var(--brand-primary); }

/* Technique cards */
.catalog-main { flex: 1; min-width: 0; }
.tech-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px,1fr)); gap: var(--sp-4); }
.tech-card {
  background: var(--surface-0); border: 1px solid var(--surface-3); border-radius: var(--r-lg);
  padding: var(--sp-4) var(--sp-5); cursor: pointer;
  transition: all var(--t-base) var(--ease-out);
}
.tech-card:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); border-color: var(--brand-primary); }
.tech-card-head { display: flex; align-items: center; gap: var(--sp-2); margin-bottom: var(--sp-2); flex-wrap: wrap; }
.tech-id { font-family: var(--font-mono); font-size: var(--text-xs); font-weight: 600; color: var(--brand-primary); background: var(--brand-dim); padding: 2px 8px; border-radius: var(--r-sm); }
.tech-name { font-weight: 700; font-size: var(--text-base); color: var(--ink-0); margin-bottom: 4px; }
.tech-desc { font-size: var(--text-sm); color: var(--ink-2); line-height: 1.5; margin-bottom: var(--sp-3); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.tech-patterns { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: var(--sp-3); }
.tech-pattern { font-size: 9px; background: var(--surface-1); color: var(--ink-2); padding: 2px 7px; border-radius: var(--r-full); border: 1px solid var(--surface-3); font-family: var(--font-mono); }
.tech-footer { display: flex; align-items: center; justify-content: space-between; }
.tech-tactic { font-size: var(--text-xs); font-weight: 600; color: var(--ink-2); }
.tech-link { display: flex; align-items: center; gap: 4px; font-size: var(--text-xs); color: var(--brand-primary); font-weight: 600; }
.tech-link svg { width: 10px; height: 10px; }

/* Search bar */
.catalog-search { margin-bottom: var(--sp-5); }
.cat-count { font-size: var(--text-sm); color: var(--ink-2); margin-bottom: var(--sp-4); }

/* Pagination */
.pagination { display: flex; align-items: center; gap: var(--sp-2); justify-content: center; margin-top: var(--sp-8); flex-wrap: wrap; }
.page-btn { padding: 7px 14px; border-radius: var(--r-md); font-size: var(--text-sm); font-weight: 500; cursor: pointer; border: 1.5px solid var(--surface-3); background: var(--surface-0); color: var(--ink-1); transition: all var(--t-fast); }
.page-btn:hover { border-color: var(--brand-primary); color: var(--brand-primary); }
.page-btn.active { background: var(--brand-primary); border-color: var(--brand-primary); color: #fff; }
.page-btn:disabled { opacity: 0.4; pointer-events: none; }
</style>
</head>
<body>
<div class="page-wrap with-nav">
  <main class="content-area">
    <nav id="navMount"></nav>
    <div class="page-header">
      <div>
        <div class="breadcrumb" id="breadcrumb"></div>
        <div class="page-title">ATT&CK Catalog</div>
        <div class="page-subtitle">100+ MITRE ATT&CK techniques with examples, patterns, and direct links</div>
      </div>
      <div class="page-actions">
        <a href="mitre-tracker.html" class="btn btn-ghost btn-sm">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          MITRE Tracker
        </a>
      </div>
    </div>

    <!-- Search -->
    <div class="catalog-search">
      <div class="input-wrap">
        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input class="input" id="techSearch" placeholder="Search by technique name, ID, or log pattern…" oninput="onSearch()" style="padding-left:38px;font-size:var(--text-base);"/>
      </div>
    </div>

    <div class="catalog-layout">
      <!-- Tactic sidebar -->
      <aside class="tactic-sidebar">
        <div class="card" style="padding:var(--sp-3);">
          <div class="t-label" style="padding:0 var(--sp-2);margin-bottom:var(--sp-2);">Tactics</div>
          <div id="tacticNav">
            <div class="tactic-nav-item active" onclick="filterTactic('')" data-t="">All techniques</div>
          </div>
        </div>
      </aside>

      <!-- Main catalog -->
      <div class="catalog-main">
        <div class="cat-count" id="catCount">Loading…</div>
        <div class="tech-grid" id="techGrid"></div>
        <div class="pagination" id="pagination"></div>
      </div>
    </div>
  </main>
</div>

<div id="toast-container"></div>
<script src="assets/js/api.js"></script>
<script src="assets/js/auth-guard.js"></script>
<script src="assets/js/navbar.js"></script>
<script>
requireAuth();
injectNavbar();
setBreadcrumb([{href:'dashboard.html',label:'Dashboard'},{href:'mitre-catalog.html',label:'ATT&CK Catalog'}]);

let currentPage = 1, currentTactic = '', currentQ = '', totalTechs = 0;
const PAGE_SIZE = 20;

/* Load tactics for sidebar */
async function loadTactics() {
  const res = await Api.mitreTactics();
  if (!res.ok) return;
  const nav = document.getElementById('tacticNav');
  res.data.tactics.forEach(t => {
    const div = document.createElement('div');
    div.className = 'tactic-nav-item';
    div.dataset.t  = t.id;
    div.innerHTML  = `${t.name} <span class="tactic-count">—</span>`;
    div.onclick    = () => filterTactic(t.id);
    nav.appendChild(div);
  });
}

/* Load technique page */
async function loadPage(page = 1) {
  currentPage = page;
  const params = { page, limit: PAGE_SIZE };
  if (currentQ)      params.q      = currentQ;
  if (currentTactic) params.tactic = currentTactic;

  const res = await Api.mitreCatalog(params);
  if (!res.ok) { toast('Failed to load catalog','error'); return; }

  const { techniques, total } = res.data;
  totalTechs = total;
  document.getElementById('catCount').textContent = `Showing ${techniques.length} of ${total} techniques`;

  renderGrid(techniques);
  renderPagination(total);
}

function renderGrid(techs) {
  const SEV_CLS = { HIGH:'badge-danger', MEDIUM:'badge-warn', LOW:'badge-success', CRITICAL:'badge-critical' };
  document.getElementById('techGrid').innerHTML = techs.map(t => `
    <div class="tech-card card-reveal" onclick="openTech('${t.mitre_url}')">
      <div class="tech-card-head">
        <span class="tech-id">${t.id}</span>
        <span class="badge ${SEV_CLS[t.severity]||'badge-neutral'}" style="font-size:9px;">${t.severity}</span>
        <span class="badge badge-brand" style="font-size:9px;">${t.tactic_info?.name || t.tactic}</span>
      </div>
      <div class="tech-name">${t.name}</div>
      <div class="tech-desc">${t.description}</div>
      <div class="tech-patterns">
        ${(t.log_patterns||[]).slice(0,4).map(p=>`<span class="tech-pattern">${p}</span>`).join('')}
        ${(t.log_patterns||[]).length > 4 ? `<span class="tech-pattern">+${t.log_patterns.length-4} more</span>` : ''}
      </div>
      <div class="tech-footer">
        <span class="tech-tactic">${t.tactic_info?.name || ''}</span>
        <span class="tech-link">
          View on MITRE
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
        </span>
      </div>
    </div>`).join('');
  initReveal();
}

function renderPagination(total) {
  const pages = Math.ceil(total / PAGE_SIZE);
  if (pages <= 1) { document.getElementById('pagination').innerHTML = ''; return; }
  let html = `<button class="page-btn" onclick="loadPage(${currentPage-1})" ${currentPage===1?'disabled':''}>Prev</button>`;
  for (let p = 1; p <= pages; p++) {
    if (p === 1 || p === pages || Math.abs(p - currentPage) <= 2) {
      html += `<button class="page-btn ${p===currentPage?'active':''}" onclick="loadPage(${p})">${p}</button>`;
    } else if (Math.abs(p - currentPage) === 3) {
      html += `<span style="color:var(--ink-3);padding:0 4px;">…</span>`;
    }
  }
  html += `<button class="page-btn" onclick="loadPage(${currentPage+1})" ${currentPage===pages?'disabled':''}>Next</button>`;
  document.getElementById('pagination').innerHTML = html;
}

function filterTactic(tid) {
  currentTactic = tid; currentPage = 1;
  document.querySelectorAll('.tactic-nav-item').forEach(el => el.classList.toggle('active', el.dataset.t === tid));
  loadPage(1);
}

function onSearch() {
  currentQ = document.getElementById('techSearch').value.trim();
  currentPage = 1;
  loadPage(1);
}

function openTech(url) {
  window.open(url, '_blank', 'noopener');
}

loadTactics();
loadPage(1);
</script>
</body>
</html>

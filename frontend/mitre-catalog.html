<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ATT&CK Catalog — ILF</title><link rel="stylesheet" href="assets/css/tokens.css"><link rel="stylesheet" href="assets/css/global.css"><link rel="stylesheet" href="assets/css/components.css"><link rel="stylesheet" href="assets/css/navbar.css"></head><body><div class="page-wrap with-nav"><main class="content-area"><div class="page-header"><div><div class="breadcrumb"></div><div class="page-title">ATT&CK Catalog</div><div class="page-subtitle">Search techniques, tactics and detection patterns</div></div></div><div class="card" style="padding:20px;margin-bottom:18px;display:grid;grid-template-columns:1fr 220px auto;gap:12px"><input class="input" id="q" placeholder="Search technique, description or log pattern"><select class="select" id="sev"><option value="">All severities</option><option>LOW</option><option>MEDIUM</option><option>HIGH</option><option>CRITICAL</option></select><button class="btn btn-primary" onclick="load()">Search</button></div><div id="grid" class="grid-2"></div></main></div><script src="assets/js/api.js"></script><script src="assets/js/auth-guard.js"></script><script src="assets/js/navbar.js"></script><script>requireAuth();function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}async function load(){const r=await Api.mitreCatalog({q:q.value,severity:sev.value,limit:50});if(!r.ok){grid.innerHTML='<p>'+esc(r.data?.message||'Unable to load catalog')+'</p>';return;}grid.innerHTML=(r.data.techniques||[]).map(t=>'<article class="card" style="padding:20px"><div style="display:flex;justify-content:space-between;gap:10px"><strong>'+esc(t.id)+' · '+esc(t.name)+'</strong><span class="badge">'+esc(t.severity)+'</span></div><p class="text-sm text-muted">'+esc(t.description)+'</p><div class="text-xs">Tactic: '+esc(t.tactic)+'</div><div style="margin-top:10px">'+(t.log_patterns||[]).slice(0,5).map(p=>'<span class="badge" style="margin:2px">'+esc(p)+'</span>').join('')+'</div></article>').join('')||'<p>No techniques matched.</p>';}load();</script></body></html>

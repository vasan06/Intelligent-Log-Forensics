<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reports — ILF</title><link rel="stylesheet" href="assets/css/tokens.css"><link rel="stylesheet" href="assets/css/global.css"><link rel="stylesheet" href="assets/css/components.css"><link rel="stylesheet" href="assets/css/navbar.css"></head><body><div class="page-wrap with-nav"><main class="content-area"><div class="page-header"><div><div class="breadcrumb" id="breadcrumb"></div><div class="page-title">Forensic Reports</div><div class="page-subtitle">Preview the latest user-scoped analysis before exporting PDF</div></div><button class="btn btn-primary" onclick="downloadReport()">Download PDF</button></div><div id="preview" class="card" style="padding:24px;margin-bottom:20px"><div class="text-muted">Loading latest analysis…</div></div><div class="card" style="padding:24px"><div class="section-label">Report History</div><div id="history" class="text-sm text-muted">Loading…</div></div></main></div><script src="assets/js/api.js"></script><script src="assets/js/auth-guard.js"></script><script src="assets/js/navbar.js"></script><script>requireAuth();let latest=null;function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}function chart(title,labels,values){const max=Math.max(...values,1);return '<div style="margin-top:20px"><div class="section-label">'+esc(title)+'</div>'+labels.map((l,i)=>'<div style="display:grid;grid-template-columns:180px 1fr 60px;gap:10px;align-items:center;margin:8px 0"><span class="text-xs">'+esc(l)+'</span><div style="height:10px;background:var(--surface-2);border-radius:8px"><div style="height:100%;width:'+Math.round((Number(values[i]||0)/max)*100)+'%;background:var(--brand-primary);border-radius:8px"></div></div><span class="text-xs">'+Number(values[i]||0).toFixed(2)+'</span></div>').join('')+'</div>';}async function load(){const r=await Api.reportPreview({type:'overall'});if(!r.ok){preview.innerHTML='<p>'+esc(r.data?.message||'Unable to load report')+'</p>';return;}latest=r.data;const d=latest.report,s= d.summary||{};preview.innerHTML='<div class="grid-4"><div class="kpi-card"><div class="kpi-label">Logs</div><div class="kpi-value">'+Number(s.total_logs||0).toLocaleString()+'</div></div><div class="kpi-card"><div class="kpi-label">Anomalies</div><div class="kpi-value">'+Number(s.anomalies||0).toLocaleString()+'</div></div><div class="kpi-card"><div class="kpi-label">Score</div><div class="kpi-value">'+Number(s.anomaly_score||0).toFixed(2)+'</div></div><div class="kpi-card"><div class="kpi-label">Risk</div><div class="kpi-value">'+esc(s.risk_level||'LOW')+'</div></div></div><h3 style="margin-top:24px">ML analysis</h3><p class="text-sm">Primary algorithm: <strong>'+esc(d.best_algorithm)+'</strong></p>'+chart('Algorithm scores',latest.charts.algorithms.labels,latest.charts.algorithms.values)+chart('Severity distribution',latest.charts.severity.labels,latest.charts.severity.values)+'<h3 style="margin-top:24px">Flagged evidence</h3><div style="overflow:auto"><table class="data-table"><thead><tr><th>Severity</th><th>Source</th><th>Message</th></tr></thead><tbody>'+(d.flagged_entries||[]).map(x=>'<tr><td>'+esc(x.severity)+'</td><td>'+esc(x.source)+'</td><td>'+esc(x.message)+'</td></tr>').join('')+'</tbody></table></div>';}async function downloadReport(){const r=await Api.generateReport({type:'overall'});if(!r.ok){toast('Report generation failed','error');return;}downloadBlob(r.blob,'ILF_Report.pdf');toast('PDF downloaded','success');}async function historyLoad(){const r=await Api.reportHistory();history.innerHTML=r.ok&&r.data.reports.length?r.data.reports.map(x=>'<div style="padding:10px 0;border-bottom:1px solid var(--surface-2)">'+esc(x.type)+' · '+new Date(x.created_at).toLocaleString()+'</div>').join(''):'No reports generated yet.';}setBreadcrumb([{label:'Home',href:'/dashboard'},{label:'Reports'}]);load();historyLoad();</script></body></html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Reset Password — ILF</title>
<link rel="stylesheet" href="assets/css/tokens.css"/>
<link rel="stylesheet" href="assets/css/global.css"/>
<link rel="stylesheet" href="assets/css/components.css"/>
<style>
body { background: var(--surface-1); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: var(--sp-6); }
.auth-card { background: var(--surface-0); border: 1px solid var(--surface-3); border-radius: var(--r-2xl); padding: var(--sp-10); width: 100%; max-width: 440px; box-shadow: var(--shadow-lg); }
.step-section { display: none; }
.step-section.active { display: block; }
.back-link { display: flex; align-items: center; gap: var(--sp-2); color: var(--ink-2); font-size: var(--text-sm); cursor: pointer; margin-bottom: var(--sp-6); transition: color var(--t-fast); }
.back-link:hover { color: var(--brand-primary); }
.back-link svg { width: 16px; height: 16px; }
.otp-timer { font-size: var(--text-sm); color: var(--ink-3); text-align: center; margin-top: var(--sp-4); }
</style>
</head>
<body>
<div class="auth-card">
  <div style="display:flex;align-items:center;gap:var(--sp-3);margin-bottom:var(--sp-8);">
    <div style="width:36px;height:36px;background:var(--brand-primary);border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;">
      <svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20" color="#fff"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
    </div>
    <span style="font-family:var(--font-display);font-weight:800;font-size:var(--text-md);">Intelligent Log Forensic</span>
  </div>

  <!-- Step 1: Email -->
  <div class="step-section active" id="s1">
    <div class="back-link" onclick="history.back()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
      Back to sign in
    </div>
    <h2 class="t-heading" style="margin-bottom:4px;">Reset your password</h2>
    <p style="margin-bottom:var(--sp-6);">Enter your email and we'll send a 6-digit reset code.</p>
    <div class="form-group" style="margin-bottom:var(--sp-5);">
      <label class="form-label">Email address</label>
      <div class="input-wrap">
        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
        <input id="resetEmail" type="email" class="input" placeholder="you@company.io"/>
      </div>
    </div>
    <div class="err-box" id="s1Err" style="display:none;background:var(--danger-light);border:1px solid rgba(192,57,43,0.2);border-radius:var(--r-md);padding:var(--sp-3) var(--sp-4);font-size:var(--text-sm);color:var(--danger);margin-bottom:var(--sp-4);"></div>
    <button class="btn btn-primary btn-block btn-lg" onclick="doSendReset()">
      <span id="s1Text">Send reset code</span>
      <span id="s1Spin" class="spinner spinner-sm" style="display:none;border-color:rgba(255,255,255,0.3);border-top-color:#fff;"></span>
    </button>
  </div>

  <!-- Step 2: OTP + new password -->
  <div class="step-section" id="s2">
    <h2 class="t-heading" style="margin-bottom:4px;">Enter your code</h2>
    <p style="margin-bottom:var(--sp-6);">Check <strong id="resetEmailDisplay"></strong> for a 6-digit code. Expires in 30 minutes.</p>

    <div class="otp-row" id="resetOtpRow" style="margin-bottom:var(--sp-5);">
      <input class="otp-digit" type="text" maxlength="1" inputmode="numeric"/>
      <input class="otp-digit" type="text" maxlength="1" inputmode="numeric"/>
      <input class="otp-digit" type="text" maxlength="1" inputmode="numeric"/>
      <input class="otp-digit" type="text" maxlength="1" inputmode="numeric"/>
      <input class="otp-digit" type="text" maxlength="1" inputmode="numeric"/>
      <input class="otp-digit" type="text" maxlength="1" inputmode="numeric"/>
    </div>

    <div class="form-group" style="margin-bottom:var(--sp-4);">
      <label class="form-label">New password</label>
      <input id="newPw" type="password" class="input" placeholder="At least 8 characters"/>
    </div>
    <div class="form-group" style="margin-bottom:var(--sp-5);">
      <label class="form-label">Confirm password</label>
      <input id="confirmPw" type="password" class="input" placeholder="Repeat password"/>
    </div>

    <div class="err-box" id="s2Err" style="display:none;background:var(--danger-light);border:1px solid rgba(192,57,43,0.2);border-radius:var(--r-md);padding:var(--sp-3) var(--sp-4);font-size:var(--text-sm);color:var(--danger);margin-bottom:var(--sp-4);"></div>
    <button class="btn btn-primary btn-block btn-lg" onclick="doReset()">
      <span id="s2Text">Reset password</span>
      <span id="s2Spin" class="spinner spinner-sm" style="display:none;border-color:rgba(255,255,255,0.3);border-top-color:#fff;"></span>
    </button>
    <div class="otp-timer">Didn't receive it? <span style="color:var(--brand-primary);cursor:pointer;font-weight:600;" onclick="doResendReset()">Resend</span></div>
  </div>

  <!-- Step 3: Success -->
  <div class="step-section" id="s3" style="text-align:center;">
    <div style="width:56px;height:56px;background:var(--success-light);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto var(--sp-5);">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="24" height="24" color="var(--success)"><polyline points="20 6 9 17 4 12"/></svg>
    </div>
    <h2 class="t-heading" style="margin-bottom:var(--sp-3);">Password reset</h2>
    <p style="margin-bottom:var(--sp-6);">Your password has been updated successfully.</p>
    <a href="index.html" class="btn btn-primary btn-block btn-lg">Sign in</a>
  </div>
</div>

<script src="assets/js/api.js"></script>
<script>
let resetEmail = '';

document.querySelectorAll('.otp-digit').forEach((inp, i, all) => {
  inp.addEventListener('input', () => {
    inp.classList.toggle('filled', inp.value.length > 0);
    if (inp.value && i < all.length - 1) all[i + 1].focus();
  });
  inp.addEventListener('keydown', e => {
    if (e.key === 'Backspace' && !inp.value && i > 0) all[i - 1].focus();
  });
});

function getOtp() { return [...document.querySelectorAll('.otp-digit')].map(i => i.value).join(''); }

function goStep(id) {
  document.querySelectorAll('.step-section').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

async function doSendReset() {
  const email = document.getElementById('resetEmail').value.trim();
  const err   = document.getElementById('s1Err');
  if (!email) { err.textContent = 'Email is required.'; err.style.display = 'block'; return; }
  err.style.display = 'none';
  document.getElementById('s1Text').textContent = 'Sending…';
  document.getElementById('s1Spin').style.display = 'inline-block';

  const res = await Api.forgotPassword(email);
  document.getElementById('s1Text').textContent = 'Send reset code';
  document.getElementById('s1Spin').style.display = 'none';

  resetEmail = email;
  document.getElementById('resetEmailDisplay').textContent = email;
  goStep('s2');
  document.querySelectorAll('.otp-digit')[0].focus();
}

async function doReset() {
  const otp  = getOtp();
  const pw   = document.getElementById('newPw').value;
  const conf = document.getElementById('confirmPw').value;
  const err  = document.getElementById('s2Err');
  err.style.display = 'none';

  if (otp.length !== 6) { err.textContent = 'Enter all 6 digits.'; err.style.display = 'block'; return; }
  if (pw.length < 8)    { err.textContent = 'Password must be at least 8 characters.'; err.style.display = 'block'; return; }
  if (pw !== conf)      { err.textContent = 'Passwords do not match.'; err.style.display = 'block'; return; }

  document.getElementById('s2Text').textContent = 'Resetting…';
  document.getElementById('s2Spin').style.display = 'inline-block';

  const res = await Api.resetPassword(resetEmail, otp, pw);
  document.getElementById('s2Text').textContent = 'Reset password';
  document.getElementById('s2Spin').style.display = 'none';

  if (res.ok && res.data?.success) {
    goStep('s3');
  } else {
    err.textContent = res.data?.message || 'Reset failed. Check your OTP.';
    err.style.display = 'block';
    document.querySelectorAll('.otp-digit').forEach(i => { i.value = ''; i.classList.remove('filled'); });
    document.querySelectorAll('.otp-digit')[0].focus();
  }
}

async function doResendReset() {
  await Api.resendOtp(resetEmail, 'reset');
  document.querySelectorAll('.otp-digit').forEach(i => { i.value = ''; i.classList.remove('filled'); });
  document.querySelectorAll('.otp-digit')[0].focus();
}
</script>
</body>
</html>

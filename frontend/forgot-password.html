<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset Password — ILF</title><link rel="stylesheet" href="assets/css/tokens.css"><link rel="stylesheet" href="assets/css/global.css"><link rel="stylesheet" href="assets/css/components.css"></head><body><main style="max-width:520px;margin:8vh auto;padding:24px"><div class="card" style="padding:32px"><h1>Reset your password</h1><p class="text-muted">We will check your account and send a one-time code to the registered email.</p><div id="notice"></div><form id="request"><label class="form-label">Email</label><input class="input" id="email" type="email" required><button class="btn btn-primary" style="margin-top:14px;width:100%">Send code</button></form><form id="reset" style="display:none;margin-top:20px"><label class="form-label">OTP</label><input class="input" id="otp" inputmode="numeric" maxlength="6" required><label class="form-label" style="margin-top:12px">New password</label><input class="input" id="password" type="password" minlength="8" required><button class="btn btn-primary" style="margin-top:14px;width:100%">Reset password</button></form><a href="/login" style="display:block;margin-top:20px">Back to sign in</a></div></main><script src="assets/js/api.js"></script><script>const q=new URLSearchParams(location.search);email.value=q.get('email')||'';request.onsubmit=async e=>{e.preventDefault();const r=await Api.forgotPassword(email.value.trim().toLowerCase());if(r.ok){notice.innerHTML='<p class="text-success">Reset code sent. Enter it below.</p>';request.style.display='none';reset.style.display='block';return;}if(r.status===404&&r.data?.redirect){location.href='/signup?email='+encodeURIComponent(email.value.trim().toLowerCase());return;}notice.innerHTML='<p class="text-danger">'+(r.data?.message||'Unable to send code')+'</p>';};reset.onsubmit=async e=>{e.preventDefault();const r=await Api.resetPassword(email.value.trim().toLowerCase(),otp.value.trim(),password.value);if(r.ok){notice.innerHTML='<p class="text-success">Password reset successfully. You can sign in now.</p>';reset.style.display='none';}else notice.innerHTML='<p class="text-danger">'+(r.data?.message||'Reset failed')+'</p>';};</script></body></html>

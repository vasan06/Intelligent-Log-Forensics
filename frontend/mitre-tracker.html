<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>MITRE Tracker — ILF</title>
<link rel="stylesheet" href="assets/css/tokens.css"/>
<link rel="stylesheet" href="assets/css/global.css"/>
<link rel="stylesheet" href="assets/css/components.css"/>
<link rel="stylesheet" href="assets/css/navbar.css"/>
<link rel="stylesheet" href="assets/css/animations.css"/>
<style>
/* Tactic summary pills */
.tactic-pills { display: flex; flex-wrap: wrap; gap: var(--sp-2); margin-bottom: var(--sp-5); }
.tactic-pill {
  display: flex; align-items: center; gap: var(--sp-2);
  padding: 5px 14px; border-radius: var(--r-full);
  font-size: var(--text-xs); font-weight: 600; cursor: pointer;
  border: 1.5px solid transparent; background: var(--surface-2); color: var(--ink-1);
  transition: all var(--t-fast);
}
.tactic-pill:hover, .tactic-pill.active { background: var(--brand-dim); border-color: rgba(45,43,107,0.3); color: var(--brand-primary); }
.tactic-pill-count { background: var(--brand-primary); color: #fff; width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 9px; }

/* Match card */
.match-card {
  padding: var(--sp-4) var(--sp-5);
  border: 1px solid var(--surface-3); border-radius: var(--r-lg);
  background: var(--surface-0); transition: all var(--t-base) var(--ease-out);
  cursor: pointer;
}
.match-card:hover { box-shadow: var(--shadow-md); transform: translateY(-1px); border-color: var(--brand-primary); }
.match-card-header { display: flex; align-items: center; gap: var(--sp-3); margin-bottom: var(--sp-2); flex-wrap: wrap; }
.match-tid { font-family: var(--font-mono); font-size: var(--text-xs); font-weight: 600; color: var(--brand-primary); background: var(--brand-dim); padding: 2px 8px; border-radius: var(--r-sm); }
.match-name { font-weight: 600; font-size: var(--text-sm); }
.match-log { font-family: var(--font-mono); font-size: 11px; color: var(--ink-2); background: var(--surface-1); padding: 6px 10px; border-radius: var(--r-sm); margin-top: var(--sp-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pattern-chip { display: inline-flex; align-items: center; padding: 1px 8px; border-radius: var(--r-full); font-size: 10px; background: var(--warn-light); color: var(--warn); border: 1px solid rgba(184,115,51,0.2); margin-right: 4px; margin-top: 4px; }

/* Severity colours for risk */
.sev-HIGH     { background: var(--danger-light);   color: var(--danger);   border: 1px solid rgba(192,57,43,0.2); }
.sev-MEDIUM   { background: var(--warn-light);     color: var(--warn);     border: 1px solid rgba(184,115,51,0.2); }
.sev-LOW      { background: var(--success-light);  color: var(--success);  border: 1px solid rgba(46,139,110,0.2); }
.sev-CRITICAL { background: var(--critical-light); color: var(--critical); border: 1px solid rgba(123,45,139,0.2); }

/* Empty state */
.empty-map { display: flex; flex-direction: column; align-items: center; gap: var(--sp-4); padding: var(--sp-12); color: var(--ink-3); text-align: center; }
</style>
</head>
<body>
<div class="page-wrap with-nav">
  <main class="content-area">
    <nav id="navMount"></nav>
    <div class="page-header">
      <div>
        <div class="breadcrumb" id="breadcrumb"></div>
        <div class="page-title">MITRE Tracker</div>
        <div class="page-subtitle">Automatically maps logs to MITRE ATT&CK techniques and tactics</div>
      </div>
      <div class="page-actions">
        <a href="mitre-catalog.html" class="btn btn-ghost btn-sm">ATT&CK Catalog</a>
        <button class="btn btn-primary btn-sm" onclick="runMapping()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          Map Logs Now
        </button>
      </div>
    </div>

    <!-- Config row -->
    <div class="card mb-5" style="padding:var(--sp-5);">
      <div class="grid-3" style="gap:var(--sp-4);align-items:flex-end;">
        <div class="form-group">
          <label class="form-label">Simulation Mode</label>
          <select class="select" id="mapMode">
            <option value="random">Random Mixed</option>
            <option value="hacking" selected>APT / Hacking</option>
            <option value="ddos">DDoS</option>
            <option value="brute_force">Brute Force</option>
            <option value="malware">Malware / C2</option>
            <option value="ransomware">Ransomware</option>
            <option value="insider_threat">Insider Threat</option>
            <option value="sql_injection">SQL Injection</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Log count</label>
          <select class="select" id="mapCount">
            <option value="20">20 logs</option>
            <option value="50" selected>50 logs</option>
            <option value="100">100 logs</option>
          </select>
        </div>
        <div>
          <button class="btn btn-primary btn-block" id="mapBtn" onclick="runMapping()">
            <span id="mapBtnText">Map Logs to MITRE</span>
            <span id="mapSpin" class="spinner spinner-sm" style="display:none;border-color:rgba(255,255,255,0.3);border-top-color:#fff;"></span>
          </button>
        </div>
      </div>
    </div>

    <!-- Summary stats -->
    <div class="grid-4 mb-5" id="mapStats" style="display:none;">
      <div class="card" style="padding:var(--sp-4) var(--sp-5);">
        <div class="t-label" style="margin-bottom:4px;">Techniques Matched</div>
        <div style="font-family:var(--font-display);font-size:var(--text-2xl);font-weight:800;color:var(--ink-0);" id="statTech">—</div>
      </div>
      <div class="card" style="padding:var(--sp-4) var(--sp-5);">
        <div class="t-label" style="margin-bottom:4px;">Tactics Involved</div>
        <div style="font-family:var(--font-display);font-size:var(--text-2xl);font-weight:800;color:var(--brand-primary);" id="statTactics">—</div>
      </div>
      <div class="card" style="padding:var(--sp-4) var(--sp-5);">
        <div class="t-label" style="margin-bottom:4px;">Critical Findings</div>
        <div style="font-family:var(--font-display);font-size:var(--text-2xl);font-weight:800;color:var(--danger);" id="statCrit">—</div>
      </div>
      <div class="card" style="padding:var(--sp-4) var(--sp-5);">
        <div class="t-label" style="margin-bottom:4px;">Logs Analysed</div>
        <div style="font-family:var(--font-display);font-size:var(--text-2xl);font-weight:800;color:var(--ink-0);" id="statLogs">—</div>
      </div>
    </div>

    <!-- Tactic filter pills -->
    <div class="tactic-pills" id="tacticPills" style="display:none;"></div>

    <!-- Matches grid -->
    <div id="matchesWrap">
      <div class="empty-map" id="emptyMap">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" style="opacity:0.3;"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        <p>Select a simulation mode and click <strong>Map Logs to MITRE</strong> to begin.</p>
      </div>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:var(--sp-4);" id="matchGrid" style="display:none;"></div>
    </div>
  </main>
</div>

<div id="toast-container"></div>
<script src="assets/js/api.js"></script>
<script src="assets/js/auth-guard.js"></script>
<script src="assets/js/navbar.js"></script>
<script>
requireAuth();
injectNavbar();
setBreadcrumb([{href:'dashboard.html',label:'Dashboard'},{href:'mitre-tracker.html',label:'MITRE Tracker'}]);

let allMatches = [], activeTactic = 'all';

async function runMapping() {
  const mode  = document.getElementById('mapMode').value;
  const count = parseInt(document.getElementById('mapCount').value);
  const btn   = document.getElementById('mapBtn');
  btn.disabled = true;
  document.getElementById('mapBtnText').textContent = 'Mapping…';
  document.getElementById('mapSpin').style.display = 'inline-block';

  // Fetch simulated logs then map them
  const logsRes = await Api.streamLogs({ mode, count, source:'all', severity:'all' });
  if (!logsRes.ok) { toast('Failed to fetch logs','error'); resetBtn(); return; }

  const mapRes = await Api.mitreMap({ logs: logsRes.data.logs });
  resetBtn();
  if (!mapRes.ok) { toast('Mapping failed','error'); return; }

  const d = mapRes.data;
  allMatches = d.matches || [];

  // Stats
  document.getElementById('mapStats').style.display = 'grid';
  animateCount(document.getElementById('statTech'),    allMatches.length);
  animateCount(document.getElementById('statTactics'), (d.tactic_summary || []).length);
  animateCount(document.getElementById('statCrit'),    allMatches.filter(m => m.severity === 'CRITICAL' || m.severity === 'HIGH').length);
  animateCount(document.getElementById('statLogs'),    logsRes.data.logs.length);

  // Tactic pills
  buildTacticPills(d.tactic_summary || []);

  // Render all
  activeTactic = 'all';
  renderMatches(allMatches);
  document.getElementById('emptyMap').style.display = 'none';
  document.getElementById('matchGrid').style.display = 'grid';

  if (allMatches.length === 0) {
    toast('No MITRE mappings found — try a different simulation mode','warn');
    document.getElementById('emptyMap').style.display = 'flex';
    document.getElementById('matchGrid').style.display = 'none';
  } else {
    toast(`Mapped ${allMatches.length} techniques across ${(d.tactic_summary||[]).length} tactics`, 'success');
  }
}

function resetBtn() {
  const btn = document.getElementById('mapBtn');
  btn.disabled = false;
  document.getElementById('mapBtnText').textContent = 'Map Logs to MITRE';
  document.getElementById('mapSpin').style.display = 'none';
}

function buildTacticPills(summary) {
  const wrap = document.getElementById('tacticPills');
  wrap.style.display = 'flex';
  wrap.innerHTML = `<div class="tactic-pill active" id="tp-all" onclick="filterTactic('all')">All <span class="tactic-pill-count">${allMatches.length}</span></div>` +
    summary.map(t =>
      `<div class="tactic-pill" id="tp-${t.tactic}" onclick="filterTactic('${t.tactic}')">${t.name} <span class="tactic-pill-count">${t.count}</span></div>`
    ).join('');
}

function filterTactic(tactic) {
  activeTactic = tactic;
  document.querySelectorAll('.tactic-pill').forEach(p => p.classList.remove('active'));
  document.getElementById('tp-' + tactic)?.classList.add('active');
  const filtered = tactic === 'all' ? allMatches : allMatches.filter(m => m.tactic === tactic);
  renderMatches(filtered);
}

function renderMatches(matches) {
  document.getElementById('matchGrid').innerHTML = matches.map(m => `
    <div class="match-card" onclick="window.open('${m.mitre_url}','_blank')">
      <div class="match-card-header">
        <span class="match-tid">${m.technique}</span>
        <span class="badge sev-${m.severity}" style="font-size:10px;">${m.severity}</span>
        <span class="badge badge-brand" style="font-size:10px;">${m.tactic_name}</span>
      </div>
      <div class="match-name">${m.name}</div>
      <div class="match-log">${m.log_msg}</div>
      <div style="margin-top:var(--sp-2);">
        ${(m.patterns_hit || []).map(p => `<span class="pattern-chip">${p}</span>`).join('')}
      </div>
      <div style="display:flex;align-items:center;gap:4px;margin-top:var(--sp-3);font-size:10px;color:var(--brand-primary);">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
        View on attack.mitre.org
      </div>
    </div>`).join('');
}
</script>
</body>
</html>

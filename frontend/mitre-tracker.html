<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MITRE Tracker — ILF</title><link rel="stylesheet" href="assets/css/tokens.css"><link rel="stylesheet" href="assets/css/global.css"><link rel="stylesheet" href="assets/css/components.css"><link rel="stylesheet" href="assets/css/navbar.css"></head><body><div class="page-wrap with-nav"><main class="content-area"><div class="page-header"><div><div class="breadcrumb"></div><div class="page-title">MITRE Tracker</div><div class="page-subtitle">Map the latest analysed evidence to ATT&CK techniques</div></div><button class="btn btn-primary" onclick="run()">Map latest logs</button></div><div id="summary" class="grid-4 mb-6"></div><div class="card" style="padding:22px"><div class="section-label">Technique coverage</div><div id="table" class="text-sm text-muted">Run a mapping to begin.</div></div></main></div><script src="assets/js/api.js"></script><script src="assets/js/auth-guard.js"></script><script src="assets/js/navbar.js"></script><script>requireAuth();async function run(){const r=await Api.mitreUserLatest();if(!r.ok){toast('MITRE mapping failed','error');return;}const x=r.data;summary.innerHTML='<div class="kpi-card"><div class="kpi-label">Techniques</div><div class="kpi-value">'+x.total_matches+'</div></div>'+(x.tactic_summary||[]).slice(0,3).map(t=>'<div class="kpi-card"><div class="kpi-label">'+t.name+'</div><div class="kpi-value">'+t.count+'</div></div>').join('');table.innerHTML='<table class="data-table" style="width:100%"><thead><tr><th>Technique</th><th>Name</th><th>Tactic</th><th>Severity</th><th>Patterns</th></tr></thead><tbody>'+(x.matches||[]).map(m=>'<tr><td>'+m.technique+'</td><td>'+m.name+'</td><td>'+m.tactic_name+'</td><td>'+m.severity+'</td><td>'+m.patterns_hit.join(', ')+'</td></tr>').join('')+'</tbody></table>';}run();</script></body></html>

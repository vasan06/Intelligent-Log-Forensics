<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — ILF</title><link rel="stylesheet" href="assets/css/tokens.css"><link rel="stylesheet" href="assets/css/global.css"><link rel="stylesheet" href="assets/css/components.css"><link rel="stylesheet" href="assets/css/navbar.css"></head><body><div class="page-wrap with-nav"><main class="content-area"><div class="page-header"><div><div class="breadcrumb" id="breadcrumb"></div><div class="page-title">Administration</div><div class="page-subtitle">Global system controls and real database users</div></div><button class="btn btn-ghost" onclick="loadAll()">Refresh</button></div><div class="grid-4 mb-6"><div class="kpi-card"><div class="kpi-label">Users</div><div class="kpi-value" id="uCount">—</div></div><div class="kpi-card"><div class="kpi-label">Active Users</div><div class="kpi-value" id="uActive">—</div></div><div class="kpi-card"><div class="kpi-label">Uploaded Files</div><div class="kpi-value" id="fCount">—</div></div><div class="kpi-card"><div class="kpi-label">Analyses</div><div class="kpi-value" id="aCount">—</div></div></div><div class="card" style="padding:24px;margin-bottom:20px"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap"><div><div class="section-label">Create User</div><p class="text-sm text-muted">Add an account directly from the administration panel.</p></div></div><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px"><input class="input" id="newName" placeholder="Name"><input class="input" id="newEmail" type="email" placeholder="Email"><input class="input" id="newPassword" type="password" placeholder="Password (8+)"><select class="select" id="newRole"><option>Analyst</option><option>Viewer</option><option>Admin</option></select></div><button class="btn btn-primary" style="margin-top:14px" onclick="createUser()">Create user</button></div><div class="card" style="padding:24px"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px"><div><div class="section-label">Users</div><div class="text-sm text-muted">Every row below comes from PostgreSQL.</div></div><input class="input" style="max-width:260px" id="search" placeholder="Search users" oninput="renderUsers()"></div><div style="overflow:auto"><table class="data-table" style="width:100%"><thead><tr><th>User</th><th>Role</th><th>Status</th><th>Created</th><th>Actions</th></tr></thead><tbody id="usersBody"></tbody></table></div></div></main></div><script src="assets/js/api.js"></script><script src="assets/js/auth-guard.js"></script><script src="assets/js/navbar.js"></script><script>requireAuth();let users=[];function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}function renderUsers(){const q=(document.getElementById('search').value||'').toLowerCase();document.getElementById('usersBody').innerHTML=users.filter(u=>(u.name+' '+u.email).toLowerCase().includes(q)).map(u=>`<tr><td><strong>${esc(u.name)}</strong><div class="text-xs text-muted">${esc(u.email)}</div></td><td><select class="select" onchange="updateUser('${u.id}',{role:this.value})"><option ${u.role==='Admin'?'selected':''}>Admin</option><option ${u.role==='Analyst'?'selected':''}>Analyst</option><option ${u.role==='Viewer'?'selected':''}>Viewer</option></select></td><td><select class="select" onchange="updateUser('${u.id}',{status:this.value})"><option value="active" ${u.status==='active'?'selected':''}>active</option><option value="inactive" ${u.status==='inactive'?'selected':''}>inactive</option></select></td><td class="text-xs">${u.created_at?new Date(u.created_at).toLocaleString():''}</td><td><button class="btn btn-ghost btn-xs" onclick="editUser('${u.id}')">Edit</button> <button class="btn btn-danger btn-xs" onclick="deleteUser('${u.id}')">Delete</button></td></tr>`).join('');}async function loadAll(){const [s,u]=await Promise.all([Api.adminStats(),Api.adminUsers()]);if(!s.ok||!u.ok){toast(s.data?.message||u.data?.message||'Admin access required','error');return;}const d=s.data;document.getElementById('uCount').textContent=d.total_users;document.getElementById('uActive').textContent=d.active_users;document.getElementById('fCount').textContent=d.total_files;document.getElementById('aCount').textContent=d.total_analyses;users=u.data.users||[];renderUsers();}async function createUser(){const body={name:newName.value.trim(),email:newEmail.value.trim(),password:newPassword.value,role:newRole.value};const r=await Api.adminCreateUser(body);if(!r.ok){toast(r.data?.message||'Create failed','error');return;}newName.value=newEmail.value=newPassword.value='';toast('User created','success');loadAll();}async function updateUser(id,data){const r=await Api.adminUpdateUser(id,data);toast(r.ok?'User updated':(r.data?.message||'Update failed'),r.ok?'success':'error');if(r.ok)loadAll();}async function editUser(id){const u=users.find(x=>x.id===id);if(!u)return;const name=prompt('Name',u.name);if(name===null)return;const email=prompt('Email',u.email);if(email===null)return;updateUser(id,{name,email});}async function deleteUser(id){if(!confirm('Delete this user and all dependent data?'))return;const r=await Api.adminDeleteUser(id);toast(r.ok?'User deleted':(r.data?.message||'Delete failed'),r.ok?'success':'error');if(r.ok)loadAll();}setBreadcrumb([{label:'Home',href:'/dashboard'},{label:'Admin'}]);loadAll();</script></body></html>

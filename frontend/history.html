<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>History - Intelligent Log Forensic</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg"/>
<link rel="alternate icon" type="image/png" href="assets/favicon.svg"/>
<link rel="stylesheet" href="assets/css/tokens.css"/>
<link rel="stylesheet" href="assets/css/global.css"/>
<link rel="stylesheet" href="assets/css/components.css"/>
<link rel="stylesheet" href="assets/css/navbar.css"/>
<link rel="stylesheet" href="assets/css/animations.css"/>
<link rel="stylesheet" href="assets/css/history.css"/>
</head>
<body>
<div class="page-wrap with-nav">
  <main class="content-area">
    <nav id="navMount"></nav>

    <div class="page-header">
      <div>
        <div class="breadcrumb" id="breadcrumb"></div>
        <div class="page-title">History</div>
        <div class="page-subtitle">Review uploaded investigations, simulations, and analysis runs stored for your account.</div>
      </div>
      <div class="page-actions">
        <button class="btn btn-outline" id="bulkDeleteBtn" disabled>Delete Selected</button>
        <button class="btn btn-danger" id="clearHistoryBtn">Clear History</button>
      </div>
    </div>

    <section class="history-toolbar">
      <div class="form-group">
        <label class="form-label" for="historySearch">Search</label>
        <input class="input" id="historySearch" type="search" placeholder="Search events, source, severity"/>
      </div>
      <div class="form-group">
        <label class="form-label" for="severityFilter">Severity</label>
        <select class="select" id="severityFilter">
          <option value="all">All</option>
          <option value="INFO">Normal</option>
          <option value="WARN">Needs attention</option>
          <option value="ERROR">High risk</option>
          <option value="CRITICAL">Critical</option>
        </select>
      </div>
    </section>

    <section class="card">
      <div class="table-wrap">
        <table class="table history-table">
          <thead>
            <tr>
              <th><input type="checkbox" id="selectAllHistory" aria-label="Select all history"/></th>
              <th>Event</th>
              <th>Severity</th>
              <th>Time</th>
              <th>Source</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="historyBody">
            <tr><td colspan="6" class="history-empty">Loading history...</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>
</div>

<div class="history-detail" id="historyDetail" aria-hidden="true">
  <div class="history-detail-panel">
    <button class="history-detail-close" id="historyDetailClose" aria-label="Close details">x</button>
    <div id="historyDetailContent"></div>
  </div>
</div>

<div id="toast-container"></div>
<script src="assets/js/api.js"></script>
<script src="assets/js/auth-guard.js"></script>
<script src="assets/js/navbar.js"></script>
<script src="assets/js/page-session.js"></script>
<script src="assets/js/history.js"></script>
</body>
</html>
